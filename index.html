<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <button onclick="login()">Login</button>

    <div>
        <img id="captchaImg">
    </div>

    <input id="username" placeholder="Username">
    <input id="password" placeholder="Password" type="password">
    <input id="captcha" placeholder="Captcha">

    <button onclick="submitLogin()">Submit</button>

    <script>
        const BASE_URL = "https://a984-14-176-232-32.ngrok-free.app";
        const HEADERS = {
            "Content-Type": "application/json",
            "ngrok-skip-browser-warning": "true"
        };

        async function login() {
            const res = await fetch(`${BASE_URL}/start-login`, { headers: HEADERS });
            const data = await res.json();
            document.getElementById("captchaImg").src = data.image;
        }

        async function submitLogin() {
            const res = await fetch(`${BASE_URL}/submit-login`, {
                method: "POST",
                headers: HEADERS,
                body: JSON.stringify({
                    username: document.getElementById("username").value,
                    password: document.getElementById("password").value,
                    captcha: document.getElementById("captcha").value
                })
            });
            const data = await res.json();
            document.getElementById("captchaImg").src = data.image;
        }
    </script>
</body>

</html>
